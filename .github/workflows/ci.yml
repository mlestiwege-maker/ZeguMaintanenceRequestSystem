name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ZEGU.sln

      - name: Build
        run: dotnet build ZEGU.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/ZEGU.Tests/ZEGU.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Check for vulnerable NuGet packages
        run: dotnet list src/WebApp/ZEGU.WebApp.csproj package --vulnerable --include-transitive
